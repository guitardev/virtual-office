# ==============================================================
# Smart MSO — Cloudflare Tunnel Configuration (cloudflared)
# ==============================================================
# สถาปัตยกรรม: Web App โฮสต์บน Vercel (Edge) + Cloudflare Tunnel เชื่อม Synology NAS
# ติดตั้งบน: Synology NAS (192.168.162.26) ผ่าน Container Manager หรือ Linux Server ใน LAN

tunnel: YOUR_TUNNEL_UUID_HERE
credentials-file: /etc/cloudflared/YOUR_TUNNEL_UUID_HERE.json

# กฎการส่งต่อทราฟฟิก (Ingress Rules)
ingress:
  # 💾 บริการหลัก: เชื่อมต่อไปยัง Synology NAS DSM (File Station, Photos, Chat Attachments)
  - hostname: nas.smso.site
    service: http://192.168.162.26:5000
    originRequest:
      noTLSVerify: true
      connectTimeout: 60s
      keepAliveConnections: 100
      noChunkedEncoding: true
    # หมายเหตุ CORS: เพื่อให้เบราว์เซอร์สามารถส่งไฟล์ตรงเข้า NAS ได้ (Direct Client Upload สูงสุด 100 MB)
    # แนะนำให้ตั้งค่า Response Headers ผ่าน Cloudflare Dashboard > Rules > Transform Rules > Modify Response Header
    # (หรือหาก Tunnel เป็น Locally-Managed สามารถจัดการผ่าน Reverse Proxy ของ DSM ได้เช่นกัน)

  # (ทางเลือกเสริม) หากในอนาคตต้องการรัน Web App สำรองในวง LAN ด้วย:
  # - hostname: office-local.yourdomain.com
  #   service: http://localhost:3000

  # 🛡️ Catch-all: ปฏิเสธคำขอที่ไม่ตรงกับ Hostname
  - service: http_status:404

